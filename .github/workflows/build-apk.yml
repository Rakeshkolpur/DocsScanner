name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with commit SHA
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FileQuik-debug-${{ github.sha }}.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileQuik-debug-apk
          path: FileQuik-debug-${{ github.sha }}.apk
          retention-days: 90

      - name: Publish/update "latest" release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Auto-built from commit ${{ github.sha }} on ${{ github.ref_name }}. Download FileQuik-debug.apk below and install it on your phone to update.
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
